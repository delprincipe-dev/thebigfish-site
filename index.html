<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BigFish AI — Fish Smarter, Catch More</title>
<meta name="description" content="BigFish AI is the fishing app that learns your water. Scan spots to pick the right bait, log catches, and find your hotzones.">

<meta property="og:type" content="website">

<meta property="og:url" content="https://thebigfish.app/">

<style>
  :root {
    --abyss: #020408;
    --deep: #052029;
    --midwater: #083240;
    --teal: #0c698a;
    --brand: #0078ae;
    --sky: #269ec7;
    --foam: #eff4f7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden; /* one screen, one story — no scrolling */
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(ellipse 85% 50% at 50% 26%, rgba(12, 105, 138, 0.42) 0%, rgba(12, 105, 138, 0) 68%),
      radial-gradient(ellipse 130% 90% at 50% 115%, rgba(4, 23, 32, 0.95) 0%, rgba(2, 4, 8, 0) 55%),
      linear-gradient(180deg, #03080d 0%, #052029 36%, #083240 60%, #041720 84%, #020408 100%);
    color: var(--foam);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- underwater atmosphere ---------- */
  .scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .ray {
    position: absolute;
    top: -12%;
    width: 130px;
    height: 72%;
    background: linear-gradient(180deg, rgba(180, 230, 250, 0.12) 0%, rgba(180, 230, 250, 0.04) 45%, rgba(180, 230, 250, 0) 85%);
    transform: skewX(-14deg);
    filter: blur(7px);
    border-radius: 0 0 50% 50%;
    animation: ray-sway 12s ease-in-out infinite alternate;
  }
  .ray:nth-child(1) { left: 6%;  opacity: .75; }
  .ray:nth-child(2) { left: 33%; width: 90px;  animation-delay: -3s; animation-duration: 14s; opacity: .55; }
  .ray:nth-child(3) { left: 57%; width: 170px; animation-delay: -7s; animation-duration: 10s; opacity: .65; }
  .ray:nth-child(4) { left: 83%; width: 80px;  animation-delay: -5s; animation-duration: 15s; opacity: .45; }
  @keyframes ray-sway {
    from { transform: skewX(-14deg) translateX(-24px); opacity: .3; }
    to   { transform: skewX(-10deg) translateX(24px);  opacity: .85; }
  }

  .bubble {
    position: absolute;
    bottom: -30px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 42%, rgba(255,255,255,0.02) 100%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    8%   { opacity: .7; }
    85%  { opacity: .4; }
    100% { transform: translateY(-108vh) translateX(14px); opacity: 0; }
  }

  /* ---------- layout ---------- */
  .page {
    position: relative;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    text-align: center;
    padding: 0 28px calc(18px + env(safe-area-inset-bottom));
    max-width: 560px;
    margin: 0 auto;
  }

  /* hero — the real BigFish logo */
  .hero {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  .hero .glow {
    position: absolute;
    width: min(90vw, 420px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(12, 105, 138, 0.5) 0%, rgba(12, 105, 138, 0.18) 45%, rgba(12, 105, 138, 0) 70%);
    filter: blur(10px);
  }
  .hero img {
    position: relative;
    width: min(72vw, 330px);
    height: auto;
    filter: drop-shadow(0 0 30px rgba(38, 158, 199, 0.45)) drop-shadow(0 22px 44px rgba(0, 0, 0, 0.6));
    animation: float 6.5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-14px); }
  }

  /* wordmark */
  .wordmark {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 5px;
    font-weight: 800;
    letter-spacing: 0.16em;
    font-size: clamp(38px, 11vw, 56px);
    color: #fff;
    text-shadow: 0 2px 30px rgba(12, 105, 138, 0.55);
    line-height: 1;
  }
  .wordmark .ai {
    font-size: 0.44em;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: var(--sky);
    transform: translateY(-0.45em);
  }

  .tagline {
    margin-top: 14px;
    font-size: clamp(11px, 3.1vw, 14px);
    font-weight: 700;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    color: #9fd8ee;
    text-shadow: 0 0 18px rgba(38, 158, 199, 0.5);
  }

  /* CTAs */
  .ctas {
    margin-top: clamp(24px, 6vh, 42px);
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .btn-get {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: min(100%, 340px);
    padding: 17px 20px;
    border-radius: 16px;
    background: linear-gradient(180deg, #0e7fae 0%, var(--brand) 55%, #065f88 100%);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.14) inset,
      0 0 34px rgba(12, 105, 138, 0.75),
      0 14px 30px rgba(0, 0, 0, 0.5);
    color: #fff;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-indent: 0.12em;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-get:active { transform: scale(0.97); }
  @media (hover: hover) {
    .btn-get:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.2) inset,
        0 0 46px rgba(12, 105, 138, 0.95),
        0 18px 34px rgba(0, 0, 0, 0.5);
    }
  }
  .btn-get svg { width: 20px; height: 20px; }

  .btn-store {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 22px 10px 16px;
    border-radius: 12px;
    background: #0a0c0f;
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: #fff;
    text-decoration: none;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .btn-store:active { transform: scale(0.97); }
  @media (hover: hover) {
    .btn-store:hover { border-color: rgba(255, 255, 255, 0.45); transform: translateY(-1px); }
  }
  .btn-store svg { width: 30px; height: 30px; flex: none; }
  .btn-store .store-lines { text-align: left; line-height: 1.15; }
  .btn-store .line-1 { display: block; font-size: 10px; letter-spacing: 0.04em; color: rgba(255,255,255,0.75); }
  .btn-store .line-2 { display: block; font-size: 17px; font-weight: 700; letter-spacing: 0.01em; }

  /* footer */
  .deep {
    margin-top: clamp(18px, 4.5vh, 30px);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: rgba(239, 244, 247, 0.4);
    animation: deep-pulse 3.4s ease-in-out infinite;
  }
  @keyframes deep-pulse {
    0%, 100% { opacity: 0.35; text-shadow: none; }
    50%      { opacity: 0.85; text-shadow: 0 0 16px rgba(159, 216, 238, 0.6); }
  }

  /* short screens: tighten up */
  @media (max-height: 640px) {
    .hero img { width: min(52vw, 230px); }
    .ctas { margin-top: 16px; gap: 10px; }
    .btn-get { padding: 13px 18px; font-size: 15px; }
    .deep { margin-top: 12px; }
  }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="ray"></div>
  <div class="ray"></div>
  <div class="ray"></div>
  <div class="ray"></div>

  <span class="bubble" style="left: 12%; width: 10px; height: 10px; animation-duration: 12s; animation-delay: -2s;"></span>
  <span class="bubble" style="left: 24%; width: 6px;  height: 6px;  animation-duration: 15s; animation-delay: -7s;"></span>
  <span class="bubble" style="left: 40%; width: 13px; height: 13px; animation-duration: 13s; animation-delay: -4s;"></span>
  <span class="bubble" style="left: 57%; width: 7px;  height: 7px;  animation-duration: 17s; animation-delay: -9s;"></span>
  <span class="bubble" style="left: 70%; width: 11px; height: 11px; animation-duration: 11s; animation-delay: -1s;"></span>
  <span class="bubble" style="left: 84%; width: 5px;  height: 5px;  animation-duration: 19s; animation-delay: -12s;"></span>
  <span class="bubble" style="left: 92%; width: 9px;  height: 9px;  animation-duration: 14s; animation-delay: -6s;"></span>
</div>

<main class="page">

  <div class="hero">
    <div class="glow" aria-hidden="true"></div>
    <img src="logo-white.png" alt="BigFish AI logo" draggable="false">
  </div>

  <h1 class="wordmark">BIGFISH<span class="ai">AI</span></h1>
  <p class="tagline">FISH SMARTER, CATCH MORE</p>

  <div class="ctas">
    <a class="btn-get" href="https://apps.apple.com/us/app/bigfish-ai/id6794939963" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2 L14.5 9 H21.5 L16 13.5 L18 20.5 L12 16.2 L6 20.5 L8 13.5 L2.5 9 H9.5 Z" fill="#ffffff"/>
      </svg>
      GET BIGFISH
    </a>

    <a class="btn-store" href="https://apps.apple.com/us/app/bigfish-ai/id6794939963" target="_blank" rel="noopener" aria-label="Download on the App Store">
      <svg viewBox="0 0 384 512" aria-hidden="true"><!-- Apple logo -->
        <path fill="#ffffff" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.1-136.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
      </svg>
      <span class="store-lines">
        <span class="line-1">Download on the</span>
        <span class="line-2">App Store</span>
      </span>
    </a>
  </div>

  <p class="deep">TAP TO ENTER THE DEEP</p>

</main>

</body>
</html>
