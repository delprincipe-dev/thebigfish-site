<head>

<style>
  :root {
    --abyss: #020408;
    --deep: #052029;
    --midwater: #083240;
    --teal: #0c698a;
    --brand: #0078ae;
    --sky: #269ec7;
    --foam: #eff4f7;
    --store-url: https://apps.apple.com/us/app/bigfish-ai/id6794939963;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden; /* no scrolling — one screen, one story */
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(ellipse 90% 55% at 50% 30%, rgba(12, 105, 138, 0.38) 0%, rgba(12, 105, 138, 0) 65%),
      radial-gradient(ellipse 120% 80% at 50% 110%, rgba(4, 23, 32, 0.9) 0%, rgba(2, 4, 8, 0) 60%),
      linear-gradient(180deg, #03080d 0%, #052029 34%, #083240 58%, #041720 82%, #020408 100%);
    color: var(--foam);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- underwater scene ---------- */
  .scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  /* god rays from the surface */
  .ray {
    position: absolute;
    top: -12%;
    width: 130px;
    height: 75%;
    background: linear-gradient(180deg, rgba(180, 230, 250, 0.14) 0%, rgba(180, 230, 250, 0.05) 45%, rgba(180, 230, 250, 0) 85%);
    transform: skewX(-14deg);
    filter: blur(6px);
    border-radius: 0 0 50% 50%;
    animation: ray-sway 11s ease-in-out infinite alternate;
  }
  .ray:nth-child(1) { left: 8%;  opacity: .8; }
  .ray:nth-child(2) { left: 34%; width: 90px; animation-delay: -3s; animation-duration: 13s; opacity: .6; }
  .ray:nth-child(3) { left: 58%; width: 170px; animation-delay: -7s; animation-duration: 9s;  opacity: .7; }
  .ray:nth-child(4) { left: 82%; width: 80px; animation-delay: -5s; animation-duration: 14s; opacity: .5; }
  @keyframes ray-sway {
    from { transform: skewX(-14deg) translateX(-26px); opacity: .35; }
    to   { transform: skewX(-10deg) translateX(26px);  opacity: .9; }
  }

  /* rising bubbles */
  .bubble {
    position: absolute;
    bottom: -30px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.12) 42%, rgba(255,255,255,0.03) 100%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    8%   { opacity: .85; }
    85%  { opacity: .5; }
    100% { transform: translateY(-108vh) translateX(14px); opacity: 0; }
  }

  /* drifting background fish */
  .bg-fish {
    position: absolute;
    opacity: 0.16;
    filter: blur(1px);
    animation: drift linear infinite;
  }
  @keyframes drift {
    from { transform: translateX(30vw) scaleX(1); }
    75%  { transform: translateX(-85vw) scaleX(1); }
    76%  { transform: translateX(-85vw) scaleX(-1); }
    to   { transform: translateX(30vw) scaleX(-1); }
  }

  /* ---------- layout ---------- */
  .page {
    position: relative;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    text-align: center;
    padding: 0 28px calc(20px + env(safe-area-inset-bottom));
    max-width: 560px;
    margin: 0 auto;
  }

  /* hero fish */
  .hero {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  .hero svg {
    width: min(78vw, 380px);
    height: auto;
    filter: drop-shadow(0 0 34px rgba(12, 105, 138, 0.65)) drop-shadow(0 18px 40px rgba(0, 0, 0, 0.55));
    animation: swim 6.5s ease-in-out infinite;
    transform-origin: 50% 50%;
  }
  @keyframes swim {
    0%, 100% { transform: translateY(0) rotate(-1.2deg); }
    50%      { transform: translateY(-16px) rotate(1.4deg); }
  }

  /* wordmark */
  .wordmark {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 5px;
    font-weight: 800;
    letter-spacing: 0.16em;
    font-size: clamp(38px, 11vw, 56px);
    color: #fff;
    text-shadow: 0 2px 30px rgba(12, 105, 138, 0.55);
    line-height: 1;
  }
  .wordmark .ai {
    font-size: 0.44em;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: var(--sky);
    transform: translateY(-0.45em);
  }

  .tagline {
    margin-top: 14px;
    font-size: clamp(11px, 3.1vw, 14px);
    font-weight: 700;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    color: #9fd8ee;
    text-shadow: 0 0 18px rgba(38, 158, 199, 0.5);
  }

  /* CTAs */
  .ctas {
    margin-top: clamp(26px, 6.5vh, 44px);
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .btn-get {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: min(100%, 340px);
    padding: 17px 20px;
    border-radius: 16px;
    background: linear-gradient(180deg, #0e7fae 0%, var(--brand) 55%, #065f88 100%);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.14) inset,
      0 0 34px rgba(12, 105, 138, 0.75),
      0 14px 30px rgba(0, 0, 0, 0.5);
    color: #fff;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-indent: 0.12em;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-get:active { transform: scale(0.97); }
  @media (hover: hover) {
    .btn-get:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.2) inset,
        0 0 46px rgba(12, 105, 138, 0.95),
        0 18px 34px rgba(0, 0, 0, 0.5);
    }
  }
  .btn-get svg { width: 20px; height: 20px; }

  .btn-store {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 22px 10px 16px;
    border-radius: 12px;
    background: #0a0c0f;
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: #fff;
    text-decoration: none;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .btn-store:active { transform: scale(0.97); }
  @media (hover: hover) {
    .btn-store:hover { border-color: rgba(255, 255, 255, 0.45); transform: translateY(-1px); }
  }
  .btn-store svg { width: 30px; height: 30px; flex: none; }
  .btn-store .store-lines { text-align: left; line-height: 1.15; }
  .btn-store .line-1 { display: block; font-size: 10px; letter-spacing: 0.04em; color: rgba(255,255,255,0.75); }
  .btn-store .line-2 { display: block; font-size: 17px; font-weight: 700; letter-spacing: 0.01em; }

  /* footer */
  .deep {
    margin-top: clamp(20px, 5vh, 34px);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: rgba(239, 244, 247, 0.4);
    animation: deep-pulse 3.4s ease-in-out infinite;
  }
  @keyframes deep-pulse {
    0%, 100% { opacity: 0.35; text-shadow: none; }
    50%      { opacity: 0.85; text-shadow: 0 0 16px rgba(159, 216, 238, 0.6); }
  }

  /* short screens: tighten up */
  @media (max-height: 640px) {
    .hero svg { width: min(58vw, 260px); }
    .ctas { margin-top: 18px; gap: 10px; }
    .btn-get { padding: 13px 18px; font-size: 15px; }
    .deep { margin-top: 14px; }
  }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">

  <div class="ray"></div>

  <svg class="bg-fish" style="top: 16%; left: -12%; width: 74px; animation-duration: 26s;" viewBox="0 0 240 120">
